<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:Brico;src:url("../../assets/fonts/BricolageGrotesque.ttf");font-weight:200 800;font-stretch:75% 100%;font-display:block}
@font-face{font-family:Mono;src:url("../../assets/fonts/JetBrainsMono-Bold.ttf");font-weight:700;font-display:block}
html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}
</style><script>
// ?tema=NOME (pasta themes/NOME) e ?fmt=LxA (qualquer proporção; 1080x1920 é o padrão). Sem parâmetro: tema anime, 9:16, motor original.
(function () {
  var q = new URLSearchParams(location.search), f = /^(\d+)x(\d+)$/.exec(q.get('fmt') || ''), t = q.get('tema') || 'anime';
  if (f) window.V4_FMT = { w: +f[1], h: +f[2] };
  if (!/^[a-z0-9-]+$/.test(t)) t = 'anime';
  window.V4_TEMA = t;
})();
</script></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>if (window.V4_FMT) { var c0 = document.getElementById('c'); c0.width = V4_FMT.w; c0.height = V4_FMT.h; }</script>
<script src="src/core.js"></script><script src="src/layout.js"></script><script src="src/fx.js"></script><script src="src/type.js"></script>
<script src="src/stage.js"></script><script src="src/scenes.js"></script><script src="src/scenes2.js"></script>
<script src="src/transitions.js"></script><script src="src/engine.js"></script>
<script>
// Tema diferente do anime: a camada do tema (themes/NOME/engine/tema.js) carrega por cima e substitui cenas, transições, legenda e pós.
if (window.V4_TEMA !== 'anime') document.write('<link rel="stylesheet" href="../../themes/' + V4_TEMA + '/engine/tema.css"><script src="../../themes/' + V4_TEMA + '/engine/tema.js"><\/script>');
</script>
<script>window.__ready=true</script></body></html>
